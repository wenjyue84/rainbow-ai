    <div class="mb-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
      <div>
        <h2 class="text-lg font-semibold text-neutral-800">Test Dashboard</h2>
        <p class="text-sm text-neutral-500">All test suites run automatically on load</p>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button id="btn-rerun-all" onclick="rerunAllTests()" class="text-sm bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg transition font-medium flex items-center gap-2"
          title="Re-run all test suites">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Re-run All
        </button>
        <button id="btn-run-coverage" onclick="runCoverage()" class="text-sm bg-neutral-600 hover:bg-neutral-700 text-white px-4 py-2 rounded-lg transition font-medium">
          Coverage
        </button>
        <!-- History Button -->
        <button id="btn-vitest-history" onclick="showVitestHistory()"
          class="hidden text-sm bg-white border border-neutral-300 hover:bg-neutral-50 px-3 py-2 rounded-lg transition flex items-center gap-1"
          title="View past test runs">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>History</span>
        </button>
        <!-- Export Report Dropdown -->
        <div id="vitest-export-dropdown" class="hidden relative">
          <button onclick="toggleVitestExportDropdown()"
            class="text-sm bg-white border border-neutral-300 hover:bg-neutral-50 px-3 py-2 rounded-lg transition flex items-center gap-1">
            Export Report
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          <div id="vitest-export-menu"
            class="hidden absolute right-0 mt-1 w-64 bg-white border border-neutral-300 rounded-xl shadow-lg z-50">
            <button onclick="exportVitestReport('all')"
              class="w-full text-left text-sm px-4 py-2.5 hover:bg-neutral-50 transition flex items-center gap-2 rounded-t-xl">
              <span>Export All Results</span>
            </button>
            <button onclick="exportVitestReport('failed')"
              class="w-full text-left text-sm px-4 py-2.5 hover:bg-neutral-50 transition flex items-center gap-2 border-t border-neutral-200 rounded-b-xl">
              <span>Export Failed Only</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Overall Summary Cards -->
    <div id="test-summary" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
      <div class="bg-white rounded-2xl border p-4 text-center">
        <div id="test-total" class="text-2xl font-bold text-neutral-800">
          <div class="inline-block w-5 h-5 border-2 border-neutral-300 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <div class="text-xs text-neutral-500 mt-1">Total Tests</div>
      </div>
      <div class="bg-white rounded-2xl border p-4 text-center">
        <div id="test-passed" class="text-2xl font-bold text-green-600">-</div>
        <div class="text-xs text-neutral-500 mt-1">Passed</div>
      </div>
      <div class="bg-white rounded-2xl border p-4 text-center">
        <div id="test-failed" class="text-2xl font-bold text-red-500">-</div>
        <div class="text-xs text-neutral-500 mt-1">Failed</div>
      </div>
      <div class="bg-white rounded-2xl border p-4 text-center">
        <div id="test-duration" class="text-2xl font-bold text-indigo-500">-</div>
        <div class="text-xs text-neutral-500 mt-1">Duration</div>
      </div>
    </div>

    <!-- Status Banner -->
    <div id="test-status-banner" class="hidden mb-4 rounded-2xl border p-4 flex items-center gap-3">
      <div id="test-status-icon" class="text-2xl"></div>
      <div class="flex-1">
        <div id="test-status-text" class="font-semibold"></div>
        <div id="test-status-sub" class="text-sm text-neutral-500"></div>
      </div>
      <div id="test-status-actions" class="flex gap-2"></div>
    </div>

    <!-- Suite Sections (auto-populated) -->
    <div id="test-suites" class="space-y-4">
      <!-- Unit Tests Suite -->
      <div id="suite-unit" class="bg-white rounded-2xl border overflow-hidden">
        <div class="flex items-center justify-between px-5 py-3 bg-neutral-50 border-b cursor-pointer" onclick="toggleSuiteCollapse('unit')">
          <div class="flex items-center gap-3">
            <span id="suite-unit-indicator" class="w-3 h-3 rounded-full bg-neutral-300 animate-pulse flex-shrink-0"></span>
            <span class="font-semibold text-sm text-neutral-800">Unit Tests</span>
            <span id="suite-unit-count" class="text-xs text-neutral-400">running...</span>
          </div>
          <div class="flex items-center gap-3">
            <span id="suite-unit-duration" class="text-xs text-neutral-400"></span>
            <svg class="w-4 h-4 text-neutral-400 transform transition suite-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
        <div id="suite-unit-body" class="divide-y"></div>
      </div>

      <!-- Integration Tests Suite -->
      <div id="suite-integration" class="bg-white rounded-2xl border overflow-hidden">
        <div class="flex items-center justify-between px-5 py-3 bg-neutral-50 border-b cursor-pointer" onclick="toggleSuiteCollapse('integration')">
          <div class="flex items-center gap-3">
            <span id="suite-integration-indicator" class="w-3 h-3 rounded-full bg-neutral-300 animate-pulse flex-shrink-0"></span>
            <span class="font-semibold text-sm text-neutral-800">Integration Tests</span>
            <span id="suite-integration-count" class="text-xs text-neutral-400">running...</span>
          </div>
          <div class="flex items-center gap-3">
            <span id="suite-integration-duration" class="text-xs text-neutral-400"></span>
            <svg class="w-4 h-4 text-neutral-400 transform transition suite-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
        <div id="suite-integration-body" class="divide-y"></div>
      </div>

      <!-- Semantic Tests Suite -->
      <div id="suite-semantic" class="bg-white rounded-2xl border overflow-hidden">
        <div class="flex items-center justify-between px-5 py-3 bg-neutral-50 border-b cursor-pointer" onclick="toggleSuiteCollapse('semantic')">
          <div class="flex items-center gap-3">
            <span id="suite-semantic-indicator" class="w-3 h-3 rounded-full bg-neutral-300 animate-pulse flex-shrink-0"></span>
            <span class="font-semibold text-sm text-neutral-800">Semantic Tests</span>
            <span id="suite-semantic-count" class="text-xs text-neutral-400">running...</span>
          </div>
          <div class="flex items-center gap-3">
            <span id="suite-semantic-duration" class="text-xs text-neutral-400"></span>
            <svg class="w-4 h-4 text-neutral-400 transform transition suite-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
        <div id="suite-semantic-body" class="divide-y"></div>
      </div>
    </div>

    <!-- Old elements kept for compatibility -->
    <div id="test-running" class="hidden"></div>
    <div id="test-results" class="hidden"></div>
    <div id="test-empty" class="hidden"></div>

    <!-- Coverage Results -->
    <div id="coverage-results" class="hidden mt-4">
      <h3 class="font-semibold text-neutral-700 mb-3">Code Coverage</h3>
      <div class="bg-white rounded-2xl border overflow-hidden">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-neutral-50 text-left text-neutral-600">
              <th class="px-4 py-2 font-medium">File</th>
              <th class="px-4 py-2 font-medium text-right">Stmts</th>
              <th class="px-4 py-2 font-medium text-right">Branch</th>
              <th class="px-4 py-2 font-medium text-right">Funcs</th>
              <th class="px-4 py-2 font-medium text-right">Lines</th>
            </tr>
          </thead>
          <tbody id="coverage-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Vitest History Modal -->
    <div id="vitest-history-modal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white rounded-2xl p-6 max-w-4xl w-full mx-4 max-h-[80vh] overflow-hidden flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-xl font-semibold text-neutral-800">Test Run History</h3>
          <div class="flex items-center gap-2">
            <button onclick="clearVitestHistory()" class="text-xs text-red-500 hover:text-red-600 transition">Clear All</button>
            <button onclick="closeVitestHistory()" class="text-neutral-500 hover:text-neutral-700">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="vitest-history-list" class="flex-1 overflow-y-auto space-y-2">
          <div class="text-center text-neutral-400 text-sm py-12">
            <p>No test history yet</p>
            <p class="text-xs mt-1">Run tests to see results here</p>
          </div>
        </div>
      </div>
    </div>
