<div class="mb-4">
  <h2 class="text-xl font-bold text-neutral-800">Settings</h2>
  <p class="text-sm text-neutral-500 mt-1">Configure your bot, team, and system preferences.</p>
</div>

<!-- Settings layout: sidebar nav + content -->
<div class="flex gap-4 min-h-0 items-start">

  <!-- Left sidebar navigation -->
  <div class="w-52 flex-shrink-0 bg-white border border-neutral-200 rounded-2xl p-2 self-start">

    <!-- BOT & AI — first group, no top border -->
    <div class="settings-nav-group">
      <div class="settings-nav-group-label">Bot &amp; AI</div>
      <button onclick="switchSettingsTab('ai-models')" data-settings-tab="ai-models"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg bg-indigo-50 text-indigo-700 transition cursor-help"
        title="Configure AI providers like Groq, OpenAI, or local models. Set fallback order and default brain.">
        🤖 AI Models
      </button>
      <button onclick="switchSettingsTab('bot-avatar')" data-settings-tab="bot-avatar"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-800 transition cursor-help"
        title="Customize the bot avatar icon shown before AI messages in Live Chat.">
        🤖 Bot Avatar
      </button>
    </div>

    <!-- TEAM -->
    <div class="settings-nav-group border-t border-neutral-100 mt-1 pt-1">
      <div class="settings-nav-group-label">Team</div>
      <button onclick="switchSettingsTab('notifications')" data-settings-tab="notifications"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-800 transition cursor-help"
        title="System admin alerts for WhatsApp disconnections, server events, and critical errors.">
        📱 Notifications
      </button>
      <button onclick="switchSettingsTab('operators')" data-settings-tab="operators"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-800 transition cursor-help"
        title="Manage staff phone numbers who receive operational alerts and workflow escalations.">
        👥 Operators
      </button>
      <button onclick="switchSettingsTab('users')" data-settings-tab="users"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-800 transition cursor-help"
        title="Create and manage admin dashboard logins. Control which profiles each user can access.">
        🔐 Users
      </button>
    </div>

    <!-- SYSTEM -->
    <div class="settings-nav-group border-t border-neutral-100 mt-1 pt-1">
      <div class="settings-nav-group-label">System</div>
      <button onclick="switchSettingsTab('profile')" data-settings-tab="profile"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-800 transition cursor-help"
        title="Assign a WhatsApp instance to this profile for outbound message routing.">
        📋 Profile
      </button>
      <button onclick="switchSettingsTab('failover')" data-settings-tab="failover"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-800 transition cursor-help"
        title="Primary/standby coordination — controls which server replies to WhatsApp messages.">
        🔁 Failover
      </button>
      <button onclick="switchSettingsTab('mcp-servers')" data-settings-tab="mcp-servers"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-800 transition cursor-help"
        title="Connect to external MCP servers and expose Rainbow's tools as an MCP server.">
        🔌 MCP Servers
      </button>
    </div>

    <!-- LIMITS -->
    <div class="settings-nav-group border-t border-neutral-100 mt-1 pt-1">
      <div class="settings-nav-group-label">Limits</div>
      <button onclick="switchSettingsTab('messaging-limits')" data-settings-tab="messaging-limits"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-800 transition cursor-help"
        title="Configure WhatsApp Business Portfolio messaging tier limit (Meta Q2 2026 flat-cap model).">
        📊 Messaging Limits
      </button>
      <button onclick="switchSettingsTab('template-linter')" data-settings-tab="template-linter"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-800 transition cursor-help"
        title="Configure marketing keyword list used by the real-time utility template linter (US-1013). Prevents accidental cost reclassification.">
        🔍 Template Linter
      </button>
    </div>

    <!-- DESIGN -->
    <div class="settings-nav-group border-t border-neutral-100 mt-1 pt-1">
      <div class="settings-nav-group-label">Design</div>
      <button onclick="switchSettingsTab('appearance')" data-settings-tab="appearance"
        class="settings-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-800 transition cursor-help"
        title="Customize theme, colors, and visual design of this admin dashboard.">
        🎨 Appearance
      </button>
    </div>

  </div>

  <!-- Right content panel -->
  <div class="flex-1 min-w-0 bg-white border border-neutral-200 rounded-2xl p-5">
    <!-- Tab Content Container -->
    <div id="settings-tab-content" class="space-y-4">
      <div id="settings-loading" class="p-8 text-center">
        <div class="spinner mx-auto"></div>
        <p class="text-sm text-neutral-500 mt-2">Loading settings...</p>
      </div>
    </div>
  </div>

</div>
