<div class="mb-4">

</div>

<div class="flex gap-4 min-h-0 items-start">

  <div class="w-52 flex-shrink-0 bg-white border border-neutral-200 rounded-2xl p-2 self-start">
    <div class="settings-nav-group">
      <div class="settings-nav-group-label">Infrastructure</div>
      <button onclick="switchMasterTab('numbers')" data-master-tab="numbers"
        class="master-tab-btn w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg bg-indigo-50 text-indigo-700 transition"

        💬 WhatsApp Numbers
      </button>
      <button onclick="switchMasterTab('assistants')" data-master-tab="assistants"

        🔐 Users
      </button>

  <!-- Content -->
  <div id="master-tab-content" class="flex-1 min-w-0">
    <div class="p-8 text-center"><div class="spinner mx-auto"></div></div>
