version: 2
updates:
  # npm dependencies — auto-raise PRs for security patches
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # Always auto-open PRs for high/critical security advisories
    groups:
      express-and-security:
        patterns:
          - "express*"
          - "qs"
          - "helmet"
          - "express-rate-limit"
          - "cors"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kuala_Lumpur"
    labels:
      - "dependencies"
      - "ci"
