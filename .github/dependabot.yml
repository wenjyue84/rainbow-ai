version: 2
updates:
  # npm dependencies — raise PRs for manual review; no auto-merge (supply chain safety)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # lockfile-only keeps package.json exact pins unchanged; Dependabot only updates lockfile
    versioning-strategy: lockfile-only
    # Do NOT auto-rebase — all updates require manual review before merge
    rebase-strategy: "disabled"
    groups:
      express-and-security:
        patterns:
          - "express*"
          - "qs"
          - "helmet"
          - "express-rate-limit"
          - "cors"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kuala_Lumpur"
    labels:
      - "dependencies"
      - "ci"
