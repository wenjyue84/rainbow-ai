name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Log runtime versions
        run: |
          echo "Node.js $(node -v)"
          echo "OpenSSL $(node -e "process.stdout.write(process.versions.openssl)")"

      - name: Install dependencies
        run: npm ci

      - name: Verify lockfile is in sync
        run: npm install --package-lock-only --dry-run 2>/dev/null; git diff --exit-code package-lock.json || (echo "ERROR: package-lock.json is out of sync with package.json — run 'npm install' locally and commit the updated lockfile" && exit 1)

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run
